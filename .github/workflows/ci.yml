name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-test:
    name: Contract — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run contract tests
        run: cargo test -p group-savings

      - name: Build wasm artifact
        run: cargo build --target wasm32-unknown-unknown --release -p group-savings

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: group-savings-wasm
          path: target/wasm32-unknown-unknown/release/group_savings.wasm

  web-build:
    name: Web — lint, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker-build:
    name: Docker — build web image
    runs-on: ubuntu-latest
    needs: [web-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build web image
        run: docker build -f docker/Dockerfile.web -t stellar-save-web:ci .

  deploy-testnet:
    name: Deploy contract to testnet
    runs-on: ubuntu-latest
    needs: [contract-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: testnet
    steps:
      - uses: actions/checkout@v4

      - name: Download wasm artifact
        uses: actions/download-artifact@v4
        with:
          name: group-savings-wasm
          path: dist

      - name: Install soroban-cli
        run: cargo install --locked soroban-cli --version 21.5.0

      - name: Deploy to testnet
        env:
          SOROBAN_SECRET_KEY: ${{ secrets.SOROBAN_DEPLOYER_SECRET }}
        run: |
          soroban keys add deployer --secret-key "$SOROBAN_SECRET_KEY" || true
          soroban contract deploy \
            --wasm dist/group_savings.wasm \
            --source deployer \
            --network testnet
